version: "3.8"

services:
  trading-assistant:
    image: ddhdocker/trading-assistant:0.0.1
    container_name: trading-assistant-container
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    networks:
      - trading-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: trading-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge
volumes:
  redis_data:
